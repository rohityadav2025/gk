<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select=none">
    <title>Snake Game with Sound Effect & Speed Control (1-10)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        .header {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            gap: 20px;
        }

        /* Game Board */
        #game-board {
            width: 300px;
            height: 300px;
            background-color: #000;
            border: 4px solid #4CAF50;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
            overflow: hidden;
        }

        /* Snake & Food elements */
        .snake {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #4CAF50;
            border-radius: 3px;
            border: 1px solid #1a1a1a;
        }

        .snake-head {
            background-color: #8BC34A;
        }

        .food {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #FF5722;
            border-radius: 50%;
        }

        /* Game Over Screen */
        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #game-over h2 {
            color: #FF5722;
            margin-bottom: 10px;
        }

        #restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Control Section Container */
        .controls-wrapper {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* Mobile D-Pad Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 5px;
        }

        .btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #555;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .btn:active {
            background-color: #4CAF50;
            transform: scale(0.95);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        /* Speed Adjustment Controls */
        .speed-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .speed-btn {
            width: 55px;
            height: 55px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            border: 2px solid #007bff;
            background-color: #0056b3;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .speed-btn:active {
            background-color: #007bff;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Score: <span id="score">0</span></div>
        <div>Speed Level: <span id="speed-level">1</span>/10</div>
    </div>

    <div id="game-board">
        <!-- Game Over overlay -->
        <div id="game-over">
            <h2>GAME OVER</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button id="restart-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <div class="controls-wrapper">
        <!-- D-Pad Direction Controls -->
        <div class="controls">
            <button class="btn" id="btn-up">▲</button>
            <button class="btn" id="btn-left">◀</button>
            <button class="btn" id="btn-right">▶</button>
            <button class="btn" id="btn-down">▼</button>
        </div>

        <!-- Speed Adjust Buttons (+ and -) -->
        <div class="speed-controls">
            <button class="speed-btn" id="btn-plus">+</button>
            <button class="speed-btn" id="btn-minus">-</button>
        </div>
    </div>

<script>
    const board = document.getElementById('game-board');
    const scoreElement = document.getElementById('score');
    const speedLevelElement = document.getElementById('speed-level');
    const finalScoreElement = document.getElementById('final-score');
    const gameOverScreen = document.getElementById('game-over');

    const gridSize = 15;
    const boardSize = 300;

    let snake = [{x: 150, y: 150}, {x: 135, y: 150}, {x: 120, y: 150}];
    let food = {x: 0, y: 0};
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let gameInterval;
    let isGameOver = false;

    // Speed Limits: Level 1 to 10
    let speedLevel = 1; 
    const minSpeedLevel = 1;
    const maxSpeedLevel = 10;
    
    // Interval mapped linearly (Level 1 = 200ms, Level 10 = 38ms)
    function calculateInterval(level) {
        return 200 - (level - 1) * 18;
    }

    // Audio Context Synthesizer (No external sound file required)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playEatSound() {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    // Direction Controls
    function bindControl(elementId, newDx, newDy) {
        const btn = document.getElementById(elementId);
        const handlePress = (e) => {
            e.preventDefault();
            initAudio();
            changeDirection(newDx, newDy);
        };
        btn.addEventListener('pointerdown', handlePress);
    }

    bindControl('btn-up', 0, -gridSize);
    bindControl('btn-down', 0, gridSize);
    bindControl('btn-left', -gridSize, 0);
    bindControl('btn-right', gridSize, 0);

    // Speed Controls (+ / - Buttons)
    const plusBtn = document.getElementById('btn-plus');
    const minusBtn = document.getElementById('btn-minus');

    function increaseSpeed(e) {
        if (e) e.preventDefault();
        initAudio();
        if (speedLevel < maxSpeedLevel) {
            speedLevel += 1;
            updateSpeed();
        }
    }

    function decreaseSpeed(e) {
        if (e) e.preventDefault();
        initAudio();
        if (speedLevel > minSpeedLevel) {
            speedLevel -= 1;
            updateSpeed();
        }
    }

    plusBtn.addEventListener('pointerdown', increaseSpeed);
    minusBtn.addEventListener('pointerdown', decreaseSpeed);

    function updateSpeed() {
        speedLevelElement.textContent = speedLevel;
        if (!isGameOver) {
            clearInterval(gameInterval);
            gameInterval = setInterval(mainGameLoop, calculateInterval(speedLevel));
        }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
        initAudio();
        if (e.key === 'ArrowUp') changeDirection(0, -gridSize);
        if (e.key === 'ArrowDown') changeDirection(0, gridSize);
        if (e.key === 'ArrowLeft') changeDirection(-gridSize, 0);
        if (e.key === 'ArrowRight') changeDirection(gridSize, 0);
        if (e.key === '+' || e.key === '=') increaseSpeed();
        if (e.key === '-') decreaseSpeed();
    });

    function changeDirection(newDx, newDy) {
        if (newDx === -dx && newDx !== 0) return;
        if (newDy === -dy && newDy !== 0) return;
        dx = newDx;
        dy = newDy;
    }

    function createFood() {
        food.x = Math.floor(Math.random() * (boardSize / gridSize)) * gridSize;
        food.y = Math.floor(Math.random() * (boardSize / gridSize)) * gridSize;

        snake.forEach(part => {
            if (part.x === food.x && part.y === food.y) createFood();
        });
    }

    function mainGameLoop() {
        if (isGameOver) return;

        let head = {x: snake[0].x + dx, y: snake[0].y + dy};

        // Screen Wrap (दीवारों के पार जाना)
        if (head.x < 0) head.x = boardSize - gridSize;
        else if (head.x >= boardSize) head.x = 0;

        if (head.y < 0) head.y = boardSize - gridSize;
        else if (head.y >= boardSize) head.y = 0;

        // Self Collision Check (खुद से टकराने पर गेम ओवर)
        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                endGame();
                return;
            }
        }

        snake.unshift(head);

        // Food Eating Check
        if (head.x === food.x && head.y === food.y) {
            playEatSound(); // खाए जाने पर sound play होगा
            score += 10;
            scoreElement.textContent = score;
            createFood();
        } else {
            snake.pop();
        }

        render();
    }

    function render() {
        const elements = board.querySelectorAll('.snake, .food');
        elements.forEach(el => el.remove());

        // Draw Food
        const foodElement = document.createElement('div');
        foodElement.style.left = food.x + 'px';
        foodElement.style.top = food.y + 'px';
        foodElement.classList.add('food');
        board.appendChild(foodElement);

        // Draw Snake
        snake.forEach((part, index) => {
            const snakeElement = document.createElement('div');
            snakeElement.style.left = part.x + 'px';
            snakeElement.style.top = part.y + 'px';
            snakeElement.classList.add('snake');
            if (index === 0) snakeElement.classList.add('snake-head');
            board.appendChild(snakeElement);
        });
    }

    function endGame() {
        isGameOver = true;
        clearInterval(gameInterval);
        finalScoreElement.textContent = score;
        gameOverScreen.style.display = 'flex';
    }

    function restartGame() {
        snake = [{x: 150, y: 150}, {x: 135, y: 150}, {x: 120, y: 150}];
        dx = gridSize;
        dy = 0;
        score = 0;
        isGameOver = false;
        scoreElement.textContent = score;
        gameOverScreen.style.display = 'none';
        createFood();
        updateSpeed();
    }

    // Start Game
    createFood();
    gameInterval = setInterval(mainGameLoop, calculateInterval(speedLevel));
</script>

</body>
</html>
